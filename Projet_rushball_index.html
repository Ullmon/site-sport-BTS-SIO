<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sport_index</title>
  <style>
    
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #22a810da;
    }

    header-1 {
        background-color: #34af16e8;
        color: white;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 0 0 25px 25px;
    }
    header {
        background-color: #34af16e8;
        color: rgb(5, 4, 4);
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: right;
        
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
        display: flex;
        align-items: center;
        font-style: italic;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        
    }
    .logo-1 {
      image-size: Auto;
    }
    .button {
        background-color: rgb(223, 192, 57);
        border: none;
        color: white;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        cursor: pointer;
        border-radius: 25px;
        box-shadow: 10px 10px 5px rgba(0,0,0,0.5);

    }

    nav a {
        color: rgb(65, 63, 63);
        margin: 0 50px;
        font-weight: bold;
        text-decoration: none;
        font-size: 20px;
    }
    .login {
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: large;
    }

    .login input {
        padding: 5px;
        border-radius: 4px;
        border: none;
        font-size: large;
    }

    main {
        padding: 20px;
    }

    .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
    }

    .game-card {
        background-color: white;
        border-radius: 10px;
        box-shadow: 10px 10px 5px rgba(0,0,0,0.5);
        padding: 100px;
        text-align: center;
    }

    .game-card img {
        width: 100%;
        border-radius: 8px;
    }

    .game-card h4 {
        margin: 10px 0 0;
    }

    .footer {
        background-color: #13350be8;
        color: white;
        text-align: center;
        padding: 10px 0;
        position: flex;
        bottom: 0;
        width: 100%;
        border-radius: 25px 25px 0 0;
    }
    .footer p {
        margin: 0;
        font-size: 12px;
        font-family: 'Courier New', Courier, monospace;
        font-style: italic;
        font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="placeholder"><img src="Logo_FFR.png" alt="Logo"></div>
    <div class="logo">Fédération Française de Rushball</div>
  </header>
  <header-1> 
    <nav>
        <div class="button">
            <a href="#">Informations</a>
            <a href="#">Rules</a>
            <a href="#">vidéo</a>
            <a href="#">Discover</a>
       </div>
    </nav>
  </header-1>

  <main>
    <h2>Images</h2>
        <div class="game-grid">
            <div class="game-card">
                <img src="https://blocks.astratic.com/img/general-img-landscape.png" alt="Game 1">
                
            </div>
            <div class="game-card">
                <img src="https://blocks.astratic.com/img/general-img-landscape.png" alt="Game 2">
                
            </div>
            <div class="game-card">
                <img src="https://blocks.astratic.com/img/general-img-landscape.png" alt="Game 3">
                
            </div>
            <div class="game-card">
                <img src="https://blocks.astratic.com/img/general-img-landscape.png" alt="Game 4">
                
            </div>
        </div>
  </main>
  <footer class="footer">
    <p>&copy; 2024 Fédération Française de Rushball. All rights reserved.</p>
  </footer>

</body>
</html>
